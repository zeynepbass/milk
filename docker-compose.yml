services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mongo-test:
    image: mongo:7
    profiles: ["test"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
      target: dev
    environment:
      NODE_ENV: development
      PORT: 5346
      MONGO_URI: mongodb://mongo:27017/milk?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-now}
      CLIENT_URLS: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      REDIS_URL: redis://redis:6379
    ports:
      - "5346:5346"
    volumes:
      - ./server/src:/app/src
      - ./server/migrations:/app/migrations
      - uploads:/app/uploads
      - private-uploads:/app/private-uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: dev
    environment:
      REACT_APP_SERVER_URL: http://localhost:5346
      WATCHPACK_POLLING: "true"
      BROWSER: none
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - server

volumes:
  mongo-data:
  uploads:
  private-uploads:
